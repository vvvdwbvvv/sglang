name: Sync fork with upstream

# Keeps this fork's `main` an exact mirror of sgl-project/sglang `main`.
# This workflow lives on the `fork-sync` branch (the fork's default branch)
# so that `main` never carries commits that upstream does not have.

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Force-update main to upstream/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync "${{ github.repository }}" \
            --source sgl-project/sglang \
            --branch main \
            --force

      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/sync-upstream.yaml/enable"
